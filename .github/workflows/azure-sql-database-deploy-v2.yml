name: Azure SQL Database CI/CD (v2)

on:
  push:
    branches: [main, fix/*]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v1
      
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v1

      - name: Build the database project (Release configuration)
        run: msbuild TaskFlowDB/TaskFlowDB.sqlproj /p:Configuration=Release
      
      - name: Find the generated dacpac file
        id: find
        run: |
          echo "##[group]Searching for dacpac"
          $dacpac = (Get-ChildItem -Path "TaskFlowDB\bin\Release" -Filter *.dacpac -Recurse | Select-Object -First 1).FullName
          if (-not $dacpac) { Write-Error "Dacpac not found in TaskFlowDB\bin\Release"; exit 1 }
          "dacpac=$dacpac" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "Found dacpac at: $dacpac"
          echo "##[endgroup]"

      - name: Deploy Database
        uses: azure/sql-action@v2.3
        with:
          connection-string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          path: 'TaskFlowDB/bin/Release/*.dacpac'
          action: 'publish'
          skip-firewall-check: true

      - name: logout of Azure
        run: |
          echo "##[group]Logging out of Azure"
          az logout
          echo "##[endgroup]"
