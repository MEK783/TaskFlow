name: Azure SQL Database CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v1

      - name: Build SQL project (Release)
        run: msbuild /t:Build /p:Configuration=Release TaskFlowDB/TaskFlowDB.sqlproj

      - name: Locate dacpac
        id: find
        run: |
          echo "##[group]Searching for dacpac"
          $dacpac = (Get-ChildItem -Path "TaskFlowDB\bin\Release" -Filter *.dacpac -Recurse | Select-Object -First 1).FullName
          if (-not $dacpac) { Write-Error "Dacpac not found in TaskFlowDB\bin\Release"; exit 1 }
          "dacpac=$dacpac" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "Found dacpac at: $dacpac"
          echo "##[endgroup]"

      - name: Install sqlpackage
        run: choco install -y sqlpackage

      - name: Publish dacpac to Azure SQL
        env:
          AZ_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZ_SQL_DB: ${{ secrets.AZURE_SQL_DATABASE }}
          AZ_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
          AZ_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: |
          $dac = "${{ steps.find.outputs.dacpac }}"
          if (-not (Test-Path $dac)) { Write-Error "Dacpac not found: $dac"; exit 1 }
          sqlpackage /Action:Publish /SourceFile:$dac `
            /TargetServerName:"tcp:$env:AZ_SQL_SERVER.database.windows.net" `
            /TargetDatabaseName:$env:AZ_SQL_DB `
            /TargetUser:$env:AZ_SQL_USER `
            /TargetPassword:$env:AZ_SQL_PASSWORD `
            /p:AllowIncompatiblePlatform=True `
            /p:BlockOnPossibleDataLoss=False `
            /p:DropObjectsNotInSource=False
