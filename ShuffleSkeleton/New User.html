<section class="min-h-screen bg-coolGray-50 flex items-center justify-center py-12 px-4 signup-section">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a class="inline-block mb-6" href="#">
        <img class="h-10" src="https://static.shuffle.dev/uploads/files/80/804ed5dbf59fb3825b4feb004610365f5f07b3a8/logos/logo-b8524cb45e3e8150de537736df5c329e.png" alt="TaskFlow"/>
      </a>
      <h1 class="text-2xl md:text-3xl font-bold text-coolGray-900 tracking-tight mb-2">Create Account</h1>
      <p class="text-coolGray-500 font-medium">Join TaskFlow to start managing your tasks</p>
    </div>
    <div class="bg-white rounded-lg shadow-sm border border-coolGray-200 p-8">
      <form class="signup-form" action="#" method="post">
        <div class="mb-6">
          <label class="block mb-2 text-coolGray-800 font-medium" for="">Username</label>
          <input class="w-full py-3 px-4 text-coolGray-500 leading-tight placeholder-coolGray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 border border-coolGray-200 rounded-lg shadow-xs" type="text" name="new-username" placeholder="Choose a username"/>
        </div>
        <div class="mb-6">
          <label class="block mb-2 text-coolGray-800 font-medium" for="">Password</label>
          <input class="w-full py-3 px-4 text-coolGray-500 leading-tight placeholder-coolGray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 border border-coolGray-200 rounded-lg shadow-xs" type="password" name="new-password" placeholder="Create a password"/>
        </div>
        <div class="mb-6">
          <label class="block mb-2 text-coolGray-800 font-medium" for="">Referral Code</label>
          <input class="w-full py-3 px-4 text-coolGray-500 leading-tight placeholder-coolGray-400 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 border border-coolGray-200 rounded-lg shadow-xs" type="text" name="referral-code" placeholder="Enter referral code"/>
        </div>
        <button class="inline-block py-3 px-7 w-full text-lg leading-7 text-green-50 bg-green-500 hover:bg-green-600 font-medium text-center focus:ring-2 focus:ring-green-500 focus:ring-opacity-50 border border-transparent rounded-md shadow-sm register-btn" type="button">Create Account</button>
      </form>
      <div class="mt-6 text-center">
        <p class="text-coolGray-500">
          <span>Already have an account?</span>
          <a class="text-green-500 hover:text-green-600 font-medium login-link" href="#">Sign in</a>
        </p>
      </div>
    </div>
  </div>
</section>
